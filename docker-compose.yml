services:
  postgres:
    image: postgres:16-alpine
    container_name: erp_platform_pg
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postpass
      POSTGRES_DB: erp_platform
    ports:
      - "5432:5432"
    volumes:
      - erp_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d erp_platform"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  erp_pgdata:
